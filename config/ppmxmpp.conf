# Log verbosity level.
# Possible values: TRACE, DEBUG, INFO, WARN, ERROR, FATAL
log_level = "INFO";

# Path to the SQLite database file.
# Directories are created automatically if they do not exist.
db_path = "data/ppmxmpp.db";

# TCP listen address and port (plain + STARTTLS upgrade).
bind_host = "127.0.0.1";
bind_port = 5222;

# TLS certificate and key for STARTTLS.
# If the files do not exist a self-signed certificate is generated automatically.
tls_cert_file = "data/server.crt";
tls_key_file  = "data/server.key";
