name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake autoconf automake libtool pkg-config clang

      - name: Build third-party libraries
        run: make third-party

      - name: Build project
        run: make

      - name: Run tests
        run: make test
