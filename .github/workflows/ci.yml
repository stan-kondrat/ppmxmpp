name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    name: build-and-test (${{ matrix.arch }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake autoconf automake libtool pkg-config clang clang-tidy

      - name: Get third-party commit hashes
        id: submodules
        run: echo "hash=$(git submodule status | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Get Makefile hash
        id: makefile
        run: echo "hash=$(sha256sum Makefile | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Cache third-party builds
        uses: actions/cache@v4
        with:
          path: build/debug/third_party
          key: ${{ runner.os }}-${{ runner.arch }}-thirdparty-${{ steps.submodules.outputs.hash }}-${{ steps.makefile.outputs.hash }}

      - name: Build third-party libraries
        run: make third-party

      - name: Build project
        run: make

      - name: Run tests
        run: make test

      - name: Run static analysis
        run: make tidy
